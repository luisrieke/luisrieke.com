      reddit: '<path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.687-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/>',
      whatsapp: '<path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>',
    };
    const icon = (id, size = 18) =>
      `<svg class="icon" viewBox="0 0 24 24" fill="currentColor" width="${size}" height="${size}" aria-hidden="true">${ICONS[id] || ""}</svg>`;

    // ─────────────────────────── helpers ───────────────────────────
    const nf = new Intl.NumberFormat("en-US");
    const compact = (n) => (n >= 1000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, "") + "K" : nf.format(n));
    const parse = (iso) => new Date(iso.length <= 10 ? iso + "T00:00:00" : iso);
    const fmtDate = (iso) => parse(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    const fmtDateShort = (iso) => parse(iso).toLocaleDateString("en-US", { month: "short", day: "numeric" });
    const fmtTime = (iso) => parse(iso).toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: false });
    const fmtStamp = (iso) => `${fmtDate(iso)}, ${fmtTime(iso)}`;
    const dayOf = (iso) => Math.max(0, Math.floor((parse(iso) - parse(CHALLENGE.start)) / 86400000));
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    const snapshots = SNAPSHOTS.slice().sort((a, b) => parse(a.at) - parse(b.at));
    const latest = snapshots[snapshots.length - 1];

    // All snapshots containing data for a platform, with resolved timestamps
    const seriesFor = (pid) =>
      snapshots.filter((s) => s[pid]).map((s) => ({ at: s[pid].at || s.at, data: s[pid] }));
    const latestFor = (pid) => seriesFor(pid).at(-1);
    const previousFor = (pid) => seriesFor(pid).at(-2);
    // A platform can start tracking a metric later — only compare snapshots that carry it
    const seriesForKey = (pid, key) => seriesFor(pid).filter((s) => s.data[key] != null);

    const fmtValue = (m, v) => (v == null ? "–" : m.fmt ? m.fmt(v) : typeof v === "number" ? nf.format(v) : v);
    const deltaHtml = (cur, prev, unit = "") => {
      if (cur == null || prev == null || typeof cur !== "number" || typeof prev !== "number") return "";
      const d = Math.round((cur - prev) * 10) / 10;
      if (d === 0) return `<span class="stats-delta flat">±0</span>`;
      const txt = (d > 0 ? "+" : "−") + nf.format(Math.abs(d)) + (unit === "pp" ? " pp" : unit);
      return `<span class="stats-delta ${d > 0 ? "up" : "down"}">${txt}</span>`;
    };

    // ─────────────────────────── header ───────────────────────────
    const day = Math.min(dayOf(latest.at), CHALLENGE.days);
    document.getElementById("statsProgress").innerHTML = `
      <div class="stats-progress-label">
        <span>Day ${day} of ${CHALLENGE.days}</span>
        <time datetime="${esc(latest.at)}">Updated ${fmtStamp(latest.at)}</time>
      </div>
      <div class="stats-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="${CHALLENGE.days}" aria-valuenow="${day}">
        <div class="stats-progress-fill" style="width:${(day / CHALLENGE.days) * 100}%"></div>
      </div>`;

    const followersOf = (p, snap) => (snap ? snap.data[p.followersKey] : null);
    const totalFollowers = PLATFORMS.reduce((s, p) => s + (followersOf(p, latestFor(p.id)) || 0), 0);
    const prevTotalFollowers = snapshots.length > 1
      ? PLATFORMS.reduce((s, p) => s + (followersOf(p, previousFor(p.id)) ?? followersOf(p, latestFor(p.id)) ?? 0), 0)
      : null;
    const viewPlatforms = PLATFORMS.filter((p) => p.viewsKey && seriesForKey(p.id, p.viewsKey).length);
    const viewsAt = (p, i) => {
      const ser = seriesForKey(p.id, p.viewsKey);
      return (ser.at(i) ?? ser.at(-1)).data[p.viewsKey];
    };
    const totalViews = viewPlatforms.reduce((s, p) => s + viewsAt(p, -1), 0);
    const prevTotalViews = snapshots.length > 1 ? viewPlatforms.reduce((s, p) => s + viewsAt(p, -2), 0) : null;

    document.getElementById("statsHero").innerHTML = `
      <div class="stats-tile">
        <span class="stats-tile-value">${nf.format(totalFollowers)}${deltaHtml(totalFollowers, prevTotalFollowers)}</span>
        <span class="stats-tile-label">followers across ${PLATFORMS.length} channels</span>
      </div>
      <div class="stats-tile">
        <span class="stats-tile-value">${compact(totalViews)}${deltaHtml(totalViews, prevTotalViews)}</span>
        <span class="stats-tile-label">recent views on ${viewPlatforms.map((p) => p.short || p.name).join(", ")}</span>
      </div>`;

    // ─────────────────────────── chart ───────────────────────────
    const CHART_METRICS = [
      {
        id: "followers", label: "Followers",
        series: () => PLATFORMS.map((p) => ({
          id: p.id, name: p.short || p.name, color: p.color,
          points: seriesFor(p.id).map((s) => ({ t: parse(s.at), v: s.data[p.followersKey] })).filter((pt) => pt.v != null),
        })),
      },
      {
        id: "total", label: "Total followers",
        series: () => [{
          id: "total", name: "All channels", color: "#2563eb",
          points: snapshots.map((s) => ({
            t: parse(s.at),
            v: PLATFORMS.reduce((sum, p) => {
              const hit = seriesFor(p.id).filter((x) => parse(x.at) <= parse(s.at)).at(-1);
              return sum + (hit ? hit.data[p.followersKey] || 0 : 0);
            }, 0),
          })),
        }],
      },
      {
        id: "views", label: "Views",
        series: () => PLATFORMS.filter((p) => p.viewsKey).map((p) => ({
          id: p.id, name: p.short || p.name, color: p.color,
          points: seriesFor(p.id).map((s) => ({ t: parse(s.at), v: s.data[p.viewsKey] })).filter((pt) => pt.v != null),
        })),
      },
    ];

    const niceMax = (v) => {
      if (v <= 0) return 10;
      const mag = Math.pow(10, Math.floor(Math.log10(v)));
      const n = v / mag;
      const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
      return step * mag;
    };

    function renderChart(metricId) {
      const metric = CHART_METRICS.find((m) => m.id === metricId);
      const series = metric.series().filter((s) => s.points.length);
      const W = Math.max(280, document.getElementById("statsChart").clientWidth || 560);
      const H = W < 400 ? 220 : 260, PL = 44, PR = 16, PT = 14, PB = 30;
      const all = series.flatMap((s) => s.points);
      const times = all.map((p) => p.t.getTime());
      const tMin = Math.min(...times), tMax = Math.max(...times);
      const vMax = niceMax(Math.max(...all.map((p) => p.v)) * 1.15);
      const single = tMin === tMax;
      const x = (t) => (single ? (PL + W - PR) / 2 : PL + ((t - tMin) / (tMax - tMin)) * (W - PL - PR));
      const y = (v) => PT + (1 - v / vMax) * (H - PT - PB);

      const ySteps = 4;
      const grid = Array.from({ length: ySteps + 1 }, (_, i) => {
        const v = (vMax / ySteps) * i;
        return `<line x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}" class="stats-chart-grid"/>
                <text x="${PL - 8}" y="${y(v) + 3.5}" class="stats-chart-ylabel">${compact(Math.round(v))}</text>`;
      }).join("");

      // One label per calendar day, skip labels that would collide
      const byDay = new Map();
      [...new Set(times)].sort((a, b) => a - b).forEach((t) => {
        const key = new Date(t).toDateString();
        if (!byDay.has(key)) byDay.set(key, t);
      });
      const minGap = 48;
      const kept = [];
      [...byDay.values()].forEach((t, i, arr) => {
        const isLast = i === arr.length - 1;
        const collides = kept.length && x(t) - x(kept[kept.length - 1]) < minGap;
        if (!collides) kept.push(t);
        else if (isLast) kept[kept.length - 1] = t; // always show the newest date
      });
      const xLabels = kept
        .map((t) => `<text x="${x(t)}" y="${H - 8}" class="stats-chart-xlabel">${fmtDateShort(new Date(t).toISOString())}</text>`)
        .join("");

      const drawn = series.map((s) => ({
        ...s,
        points: s.points.slice().sort((a, b) => a.t - b.t),
      }));
      const stamps = [...new Set(times)].sort((a, b) => a - b);

      const lines = drawn.map((s) => {
        const d = s.points.map((p, i) => `${i ? "L" : "M"}${x(p.t.getTime()).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
        const dots = s.points.map((p) =>
          `<circle cx="${x(p.t.getTime())}" cy="${y(p.v)}" r="3.5" fill="${s.color}" class="stats-chart-dot" data-t="${p.t.getTime()}"/>`
        ).join("");
        return `${s.points.length > 1 ? `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ""}${dots}`;
      }).join("");

      const chart = document.getElementById("statsChart");
      chart.innerHTML = `
        <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(metric.label)} over time">
          ${grid}${xLabels}
          <line class="stats-chart-guide" y1="${PT}" y2="${H - PB}" visibility="hidden"/>
          ${lines}
          <rect class="stats-chart-hit" x="${PL}" y="0" width="${Math.max(0, W - PL - PR)}" height="${H}" fill="transparent"/>
        </svg>
        <div class="stats-chart-tip" hidden></div>
        ${single ? `<p class="stats-footnote stats-chart-hint">One data point so far — lines appear with the next snapshot.</p>` : ""}`;

      const fmtPoint = (d) =>
        `${d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}, ${d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: false })}`;

      const svg = chart.querySelector("svg");
      const guide = svg.querySelector(".stats-chart-guide");
      const tip = chart.querySelector(".stats-chart-tip");

      const hideTip = () => {
        chart.classList.remove("is-hovering");
        guide.style.visibility = "hidden";
        tip.hidden = true;
        svg.querySelectorAll(".stats-chart-dot.is-hot").forEach((c) => {
          c.classList.remove("is-hot");
        });
      };

      const showTip = (clientX) => {
        const rect = svg.getBoundingClientRect();
        if (!rect.width) return;
        const mx = ((clientX - rect.left) / rect.width) * W;
        let t = stamps[0];
        let best = Infinity;
        stamps.forEach((stamp) => {
          const dist = Math.abs(x(stamp) - mx);
          if (dist < best) { best = dist; t = stamp; }
        });

        const gx = x(t);
        guide.setAttribute("x1", gx);
        guide.setAttribute("x2", gx);
        guide.style.visibility = "visible";
        svg.querySelectorAll(".stats-chart-dot").forEach((c) => {
          c.classList.toggle("is-hot", Number(c.dataset.t) === t);
        });
        chart.classList.add("is-hovering");

        const rows = drawn.map((s) => {
          const i = s.points.findIndex((p) => p.t.getTime() === t);
          if (i < 0) return "";
          const cur = s.points[i].v;
          const prev = i > 0 ? s.points[i - 1].v : null;
          return `<li><span class="stats-legend-swatch" style="background:${s.color}"></span><span class="stats-chart-tip-name">${esc(s.name)}</span><span class="stats-chart-tip-value">${nf.format(cur)}${deltaHtml(cur, prev)}</span></li>`;
        }).join("");
        tip.innerHTML = `<p class="stats-chart-tip-when">${fmtPoint(new Date(t))}</p><ul>${rows}</ul>`;
        tip.hidden = false;

        const cRect = chart.getBoundingClientRect();
        const anchor = rect.left - cRect.left + (gx / W) * rect.width;
        const gap = 14;
        let left = anchor + gap;
        if (left + tip.offsetWidth > cRect.width - 8) left = anchor - gap - tip.offsetWidth;
        tip.style.left = `${Math.max(8, Math.min(left, cRect.width - tip.offsetWidth - 8))}px`;
        tip.style.top = "8px";
      };

      renderChart.hoverAbort?.abort();
      if (window.matchMedia("(hover: hover) and (pointer: fine)").matches && stamps.length) {
        const hoverAbort = new AbortController();
        renderChart.hoverAbort = hoverAbort;
        const signal = hoverAbort.signal;
        chart.addEventListener("pointermove", (e) => {
          if (e.pointerType && e.pointerType !== "mouse") return;
          showTip(e.clientX);
        }, { signal });
        chart.addEventListener("pointerleave", hideTip, { signal });
      }

      document.getElementById("statsLegend").innerHTML = drawn.map((s) => {
        const cur = s.points.at(-1).v, prev = s.points.at(-2)?.v;
        return `<li><span class="stats-legend-swatch" style="background:${s.color}"></span>${esc(s.name)}
          <span class="stats-legend-value">${nf.format(cur)}${deltaHtml(cur, prev)}</span></li>`;
      }).join("");

      document.querySelectorAll("#statsChartSwitch .buttonLanguage").forEach((b) => {
        b.classList.toggle("active", b.dataset.metric === metricId);
      });
      renderChart.current = metricId;
    }

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => renderChart(renderChart.current || "followers"), 150);
    });

    document.getElementById("statsChartSwitch").innerHTML = CHART_METRICS.map((m) =>
      `<button type="button" class="buttonLanguage" data-metric="${m.id}">${esc(m.label)}</button>`).join("");
    document.getElementById("statsChartSwitch").addEventListener("click", (e) => {
      const b = e.target.closest("[data-metric]");
      if (b) renderChart(b.dataset.metric);
    });
    renderChart("followers");

    // ─────────────────────────── bars ───────────────────────────
    const barData = PLATFORMS.map((p) => ({ p, v: followersOf(p, latestFor(p.id)) || 0 })).sort((a, b) => b.v - a.v);
    const maxFollowers = Math.max(...barData.map((b) => b.v), 1);
    document.getElementById("statsBars").innerHTML = barData.map(({ p, v }) => `
      <li class="stats-bar">
        <a class="stats-bar-name" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${icon(p.id, 16)}<span>${esc(p.short || p.name)}</span></a>
        <div class="stats-bar-track"><div class="stats-bar-fill" style="width:${Math.max((v / maxFollowers) * 100, v ? 1.5 : 0)}%;background:${p.color}"></div></div>
        <span class="stats-bar-value">${nf.format(v)}</span>
      </li>`).join("");

    // ─────────────────────────── cards ───────────────────────────
    document.getElementById("statsPlatforms").innerHTML = PLATFORMS.map((p) => {
      const cur = latestFor(p.id), prev = previousFor(p.id);
      if (!cur) return "";
      const metrics = p.metrics.map((m) => `
        <div class="stats-metric">
          <span class="stats-metric-value">${fmtValue(m, cur.data[m.key])}${deltaHtml(cur.data[m.key], prev?.data[m.key], m.unit)}</span>
          <span class="stats-metric-label">${esc(m.label)}</span>
        </div>`).join("");

      const topList = p.topKey && cur.data[p.topKey];
      const count = (n, one, many) => `${nf.format(n)} ${n === 1 ? one : many}`;
      const topMeta = (v) => [
        fmtDateShort(v.date),
        `${nf.format(v.views)} ${esc(p.topUnit || "views")}`,
        v.avgDuration ? `ø ${esc(v.avgDuration)}${v.retention ? ` (${esc(v.retention)})` : ""}` : null,
        v.likes != null ? count(v.likes, "like", "likes") : null,
        v.comments ? count(v.comments, "comment", "comments") : null,
        v.replies ? count(v.replies, "reply", "replies") : null,
        v.reposts ? count(v.reposts, "repost", "reposts") : null,
      ].filter(Boolean).join(" · ");

      const top = topList ? `
        <details class="stats-top">
          <summary>Top ${topList.length} ${esc(p.topLabel || "videos")} (${esc(p.topPeriod || p.period || "recent")})</summary>
          <ol class="stats-top-list">
            ${topList.map((v) => `
              <li>
                <span class="stats-top-title">${esc(v.title)}</span>
                <span class="stats-top-meta">${topMeta(v)}</span>
              </li>`).join("")}
          </ol>
        </details>` : "";

      const groups = p.breakdownKey && cur.data[p.breakdownKey];
      const breakdown = groups ? `
        <details class="stats-top">
          <summary>Audience (${esc(p.period || "recent")})</summary>
          <div class="stats-breakdown">
            ${groups.map((g) => `
              <div class="stats-breakdown-group">
                <h3 class="stats-breakdown-title">${esc(g.label)}</h3>
                <ul class="stats-bars">
                  ${g.rows.map((r) => `
                    <li class="stats-bar">
                      <span class="stats-bar-name"><span>${esc(r.label)}</span></span>
                      <div class="stats-bar-track"><div class="stats-bar-fill" style="width:${Math.max(r.value, r.value ? 1.5 : 0)}%;background:${p.color}"></div></div>
                      <span class="stats-bar-value">${pct(r.value)}</span>
                    </li>`).join("")}
                </ul>
              </div>`).join("")}
          </div>
        </details>` : "";

      const followers = followersOf(p, cur);
      return `
        <article class="stats-card" id="${esc(p.id)}">
          <div class="stats-card-head">
            <a class="stats-card-title" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">
              ${icon(p.id, 20)}<span>${esc(p.name)}</span><span class="stats-card-handle">${esc(p.handle)}</span>
            </a>
            <div class="stats-card-followers">
              <span class="stats-card-followers-value">${nf.format(followers)}${deltaHtml(followers, followersOf(p, prev))}</span>
              <span class="stats-card-followers-label">${esc(p.followersLabel)}</span>
            </div>
          </div>
          <p class="stats-card-period">
            <time datetime="${esc(cur.at)}">${fmtStamp(cur.at)}</time>${p.period ? ` · ${esc(p.period)}` : ""}${prev ? ` · Δ vs ${fmtDateShort(prev.at)}` : ""}
          </p>
          ${metrics ? `<div class="stats-metrics">${metrics}</div>` : ""}
          ${p.note ? `<p class="stats-card-note">${esc(p.note)} <a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Join on WhatsApp →</a></p>` : ""}
          ${top}
          ${breakdown}
        </article>`;
    }).join("");

    // ─────────────────────────── snapshot log ───────────────────────────
    document.getElementById("statsHistory").innerHTML = `
      <div class="stats-table-wrap">
        <table class="stats-table">
          <thead>
            <tr>
              <th>Snapshot</th>
              ${PLATFORMS.map((p) => `<th title="${esc(p.name)}">${icon(p.id, 14)}<span class="sr-only">${esc(p.name)}</span></th>`).join("")}
              <th>Total</th>
            </tr>
          </thead>
          <tbody>
            ${snapshots.map((s, i) => {
              const valueAt = (p, idx) => {
                for (let j = idx; j >= 0; j--) if (snapshots[j][p.id]) return snapshots[j][p.id][p.followersKey] ?? 0;
                return 0;
              };
              const cell = (v, pv, fresh = true) =>
                `<td class="${fresh ? "" : "stats-table-carried"}">${nf.format(v)}${pv != null ? deltaHtml(v, pv) : ""}</td>`;
              const total = PLATFORMS.reduce((sum, p) => sum + valueAt(p, i), 0);
              const prevTotal = i ? PLATFORMS.reduce((sum, p) => sum + valueAt(p, i - 1), 0) : null;
              return `
                <tr>
                  <td>
                    <time datetime="${esc(s.at)}">${fmtDateShort(s.at)}</time>
                    <span class="stats-table-day">${fmtTime(s.at)} · day ${dayOf(s.at)}</span>
                  </td>
                  ${PLATFORMS.map((p) => cell(valueAt(p, i), i ? valueAt(p, i - 1) : null, !!s[p.id])).join("")}
                  ${cell(total, prevTotal)}
                </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
      <p class="stats-footnote">${snapshots.length < 2
        ? "First snapshot. Every update adds a row and the deltas fill in automatically."
        : "Greyed values were carried over from the previous snapshot (platform not checked that day)."}</p>`;

    // ─────────────────────────── follow + footnote ───────────────────────────
    document.getElementById("statsFollow").innerHTML = PLATFORMS.map((p) => `
      <li><a class="linktree-link" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${icon(p.id, 20)} ${esc(p.name)}</a></li>`).join("");

    document.getElementById("statsFootnote").textContent =
      `Numbers are copied by hand from each platform's analytics. Each card shows the exact time it was read. ` +
      `Time ranges differ per platform and are noted on each card. No API, no automation — just building in public.`;
  </script>
</body>

</html>
