[[redirects]]
  from = "/12-startups"
  to = "/12-startups-in-12-weeks"
  status = 301

# The following redirect is intended for use with most SPAs that handle
# routing internally.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  # Define which paths this specific [[headers]] block will cover.
  for = "/*"
    [headers.values]
    Access-Control-Allow-Origin = "*"

[build]
  image = "jammy"
  functions = "functions"
  node_version = "24"